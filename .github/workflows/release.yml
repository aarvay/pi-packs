name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "README.md"
      - ".changeset/README.md"
      - ".editorconfig"
      - ".gitattributes"
      - ".gitignore"
      - "packages/*/CHANGELOG.md"
      - "packages/*/README.md"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push version commits + tags
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Check for unreleased changesets
        id: check
        run: |
          count=$(find .changeset -name '*.md' ! -name 'README.md' ! -name 'config.json' | wc -l | tr -d ' ')
          echo "count=$count" >> $GITHUB_OUTPUT

      - name: Version and publish
        if: steps.check.outputs.count > 0
        run: |
          set -euo pipefail

          # ── Layer 1: Auth — OIDC trusted publishing (no stored token) ──
          # npm exchanges GitHub's OIDC token for a per-run credential.
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "FATAL: NPM_TOKEN is set — trusted publishing must not use stored tokens"
            exit 1
          fi

          # ── Layer 2: Verify .gitignore defends against .npmrc ──
          if ! grep -q '^\.npmrc$' .gitignore; then
            echo "FATAL: .npmrc is not listed in .gitignore"
            exit 1
          fi

          # ── Layer 3: Version & update lockfile ──
          bun run ci:version

          # ── Layer 4: Guard — no auth files leaked into repo root ──
          for f in .npmrc .env .env.* .netrc .pypirc .yarnrc .npmrc.yml; do
            if [ -f "$f" ]; then
              echo "FATAL: Auth file '$f' found in repo root — aborting to prevent leak"
              exit 1
            fi
          done

          # ── Layer 5: Explicit staging (surgical, never blind) ──
          git add package.json bun.lock
          find packages -maxdepth 2 -name 'package.json' -exec git add {} +
          find packages -maxdepth 2 -name 'CHANGELOG.md' -exec git add {} +
          git add --all .changeset/

          # ── Layer 6: Verify only expected files are staged ──
          UNEXPECTED=$(git diff --cached --name-only | grep -Ev '^(package\.json|bun\.lock|packages/[^/]+/(package\.json|CHANGELOG\.md)|\.changeset/[^/]+)$' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "FATAL: Unexpected files staged for commit — aborting to prevent leak:"
            echo "$UNEXPECTED"
            exit 1
          fi

          # ── Layer 7: Commit & publish (publishes with provenance) ──
          git commit -m "chore: update versions" || true
          NPM_CONFIG_PROVENANCE=true bun run ci:publish

          # ── Layer 8: Post-publish guard ──
          for f in .npmrc .env .env.* .netrc; do
            if [ -f "$f" ]; then
              echo "FATAL: Auth file '$f' appeared in repo root after publish"
              exit 1
            fi
          done

          # ── Layer 9: Push ──
          git push origin HEAD:main
          git push --tags
