name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "README.md"
      - ".changeset/README.md"
      - ".editorconfig"
      - ".gitattributes"
      - ".gitignore"
      - "packages/*/CHANGELOG.md"
      - "packages/*/README.md"
  push:
    branches: [main]
    paths-ignore:
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "README.md"
      - ".changeset/README.md"
      - ".editorconfig"
      - ".gitattributes"
      - ".gitignore"
      - "packages/*/CHANGELOG.md"
      - "packages/*/README.md"

# Least privilege: this workflow only ever needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on PRs; serialize runs on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: CI
    runs-on: ubuntu-latest
    # Never run on the bot-authored version PR — versioning is validated
    # by the action; the publish workflow is its consumer.
    if: github.head_ref != 'changeset-release/main'
    steps:
      # NOTE: no credential persistence — the token is not written to
      # .git/config, so later steps can't exfiltrate it via git.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history: changeset status diffs against origin/main

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test --pass-with-no-tests

      # Ensure no package.json forgotten by oxfmt's coverage drifts from
      # canonical formatting.
      - name: Validate package.json formatting
        run: bunx prettier --check "package.json" "packages/*/package.json"

      - name: Check changeset
        run: bunx changeset status --since=origin/main

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    # Always vet the workflows themselves — a broken workflow that disables
    # CI must not be able to sneak in through paths-ignore above.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Lint workflows
        run: ./actionlint -oneline
